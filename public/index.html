<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>System Telemetry Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #09090b;
      color: #f4f4f5;
    }

    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem; }
    main { max-width: 1152px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid #27272a;
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 { margin: 0; color: #22d3ee; font-size: 1.1rem; letter-spacing: .08em; }
    h2 { margin: 0 0 1rem; color: #a1a1aa; font-size: .85rem; text-transform: uppercase; }
    #status {
      padding: .35rem .6rem;
      border: 1px solid #3f3f46;
      border-radius: .25rem;
      color: #4ade80;
      font-size: .7rem;
      white-space: nowrap;
    }
    #status[data-state="error"] { color: #f87171; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card, .panel { border: 1px solid #27272a; border-radius: .4rem; background: #18181b80; padding: 1rem; }
    .label { color: #71717a; font-size: .72rem; text-transform: uppercase; }
    .value { margin: .45rem 0 0; font-size: 1.6rem; font-weight: 700; }
    .cpu { color: #67e8f9; }
    .memory { color: #c084fc; }
    .connections { color: #60a5fa; }
    .errors { color: #f87171; }
    #logs { display: grid; gap: .5rem; }
    .log {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid #27272a80;
      padding: .45rem 0;
      color: #d4d4d8;
      font-size: .75rem;
    }
    .log-main { overflow-wrap: anywhere; }
    .log-time, .log-id { color: #71717a; }
    .log-level { color: #22d3ee; font-weight: 600; }
    @media (max-width: 760px) {
      body { padding: 1rem; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      header { align-items: flex-start; }
      h1 { font-size: .9rem; }
    }
    @media (max-width: 420px) {
      .metrics { grid-template-columns: 1fr; }
      .log { flex-direction: column; gap: .25rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>SYSTEM TELEMETRY // CORE v2.4</h1>
      <span id="status" role="status" aria-live="polite" data-state="live">LIVE STREAMING</span>
    </header>

    <section class="metrics" aria-label="System metrics">
      <article class="card">
        <div class="label">CPU Usage</div>
        <p id="cpu" class="value cpu">--%</p>
      </article>
      <article class="card">
        <div class="label">Memory Load</div>
        <p id="memory" class="value memory">--%</p>
      </article>
      <article class="card">
        <div class="label">Active Connections</div>
        <p id="connections" class="value connections">--</p>
      </article>
      <article class="card">
        <div class="label">Error Rate</div>
        <p id="errors" class="value errors">--%</p>
      </article>
    </section>

    <section class="panel" aria-labelledby="logs-heading">
      <h2 id="logs-heading">System Event Stream</h2>
      <div id="logs" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const status = document.getElementById('status');

    async function fetchTelemetry() {
      try {
        const response = await fetch('/api/telemetry');
        if (!response.ok) {
          throw new Error(`Telemetry request failed: ${response.status}`);
        }

        const data = await response.json();
        document.getElementById('cpu').textContent = `${data.metrics.cpuUsage}%`;
        document.getElementById('memory').textContent = `${data.metrics.memoryUsage}%`;
        document.getElementById('connections').textContent = data.metrics.activeConnections;
        document.getElementById('errors').textContent = `${data.metrics.errorRate}%`;

        const logs = document.getElementById('logs');
        logs.replaceChildren(...data.recentLogs.map((log) => {
          const row = document.createElement('div');
          row.className = 'log';

          const message = document.createElement('div');
          message.className = 'log-main';
          const time = document.createElement('span');
          time.className = 'log-time';
          time.textContent = `[${log.time}] `;
          const level = document.createElement('span');
          level.className = 'log-level';
          level.textContent = `(${log.level}) `;
          message.append(time, level, document.createTextNode(log.message));

          const id = document.createElement('span');
          id.className = 'log-id';
          id.textContent = log.id.slice(0, 6);
          row.append(message, id);
          return row;
        }));
        status.textContent = 'LIVE STREAMING';
        status.dataset.state = 'live';
      } catch (error) {
        console.error('Telemetry polling error:', error);
        status.textContent = 'CONNECTION ERROR';
        status.dataset.state = 'error';
      }
    }

    fetchTelemetry();
    window.setInterval(fetchTelemetry, 2500);
  </script>
</body>
</html>
